<svg xmlns="http://www.w3.org/2000/svg" width="200" height="28" viewBox="0 0 200 28">
  <style>
    .badge-text {
      font-family: Verdana, Geneva, "DejaVu Sans", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #ffffff;
      text-anchor: middle;
    }
    .d1 { animation: dot 1.6s infinite 0.0s; }
    .d2 { animation: dot 1.6s infinite 0.4s; }
    .d3 { animation: dot 1.6s infinite 0.8s; }

    @keyframes dot {
      0%, 20% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
  </style>

  <rect width="78" height="28" fill="#181824"/>

  <rect x="78" width="122" height="28" fill="#10b981"/>

  <text x="39" y="18" class="badge-text">STATUS</text>


  <text x="142" y="18" class="badge-text">COMPILING<tspan class="d1">.</tspan><tspan class="d2">.</tspan><tspan class="d3">.</tspan></text>
</svg>
